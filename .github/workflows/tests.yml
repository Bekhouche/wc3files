name: tests

# The suite on every pull request and on main: Linux, Windows and macOS, the
# oldest and newest Python the package declares on all three, and the ones
# between on Linux. Two v0.3.0 bugs (#21, #22) were Linux-only and could not
# show up when the suite only ran on Windows. Linux is pinned to Ubuntu
# 24.04, which still provides Python 3.9 (ubuntu-latest, 26.04, does not).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ['3.9', '3.13']
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Test
        run: python -m unittest discover -s tests

  package:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
      - name: Check
        run: python -m twine check dist/*
      - name: Install the wheel and import it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/python -c "import wc3files; print(wc3files.__version__)"
          /tmp/wheel-env/bin/wc3files --version

name: tests

# The suite on every pull request and on main: Linux, Windows and macOS, the
# oldest and newest Python the package declares on all three, and the ones
# between on Linux. Two v0.3.0 bugs (#21, #22) were Linux-only and could not
# show up when the suite only ran on Windows.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e . pyflakes
      - name: Test
        run: python -m unittest discover -s tests

  package:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build
        # A warning from setuptools fails the job, so a deprecated setting
        # is fixed when it appears rather than printed on every build (#171).
        run: |
          python -m pip install build twine
          set -o pipefail
          python -m build 2>&1 | tee build.log
          if grep -E "WARNING|Warning:" build.log; then exit 1; fi
      - name: Check
        run: python -m twine check dist/*
      - name: Install the wheel and import it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/python -c "import wc3files; print(wc3files.__version__)"
          /tmp/wheel-env/bin/wc3files --version
